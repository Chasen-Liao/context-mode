# v2 CI (docs/v2/impl/13-build-release.md §8, impl/14-tests.md §8, TECH-SPEC §6.6).
# 3 OS x 2 Node lines. No live layer, no secrets, no key env (ADR-0012).
# Pull requests are disabled on the repo (ADR-0014 §5), so push is the only event trigger.
# release.yml reuses this job through workflow_call (impl/13 A10).
name: ci

on:
  push:
    branches: [main, v2, v2-design, "impl/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: ["24.15.0", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # v1 runtimes for the KEEP-PASS executor tests, the same set as v1 main CI (DEVIATIONS
      # D-M2-arch-5). Dev tooling only, nothing ships. Rust is preinstalled on all three images.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false
      - uses: erlef/setup-beam@v1
        if: runner.os != 'Windows'
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - name: Elixir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install elixir --yes --no-progress
      - run: npm install
        name: dev tooling (npm is dev-only, never shipped)
      # Gate selection (DEVIATIONS D-M2-arch-4, D-M2-CI-4, D-M0-3; scripts/gate.mjs keepPass):
      # milestone = the highest milestone in .impl/progress.json "done" (M0 if none), the same
      # milestone the local gate passed before "done"; the one in progress has its own gate run. KEEP-PASS files =
      # owner milestone <= it, or owner module done. Later-milestone files are reported, not run.
      - name: gate milestone selection (D-M2-arch-4)
        shell: bash
        run: |
          node - >> "$GITHUB_ENV" <<'JS'
          const fs = require("node:fs");
          const MS = ["M0", "M1", "M2", "M3", "M4", "M5", "M6", "M7"];
          const done = JSON.parse(fs.readFileSync(".impl/progress.json", "utf8")).done;
          const ms = Math.max(0, ...done.map((d) => MS.indexOf(d)));
          const map = JSON.parse(fs.readFileSync(".impl/keep-pass-map.json", "utf8"));
          const owner = (f) => MS.indexOf(map.moduleMilestone[map.files[f].module]);
          const all = Object.keys(map.files).sort();
          const files = all.filter((f) => owner(f) <= ms || done.includes(map.files[f].module));
          const later = all.filter((f) => !files.includes(f));
          console.error(`gate milestone ${MS[ms]}: ${files.length} KEEP-PASS files run, ${later.length} owned by a later milestone: ${later.join(" ")}`);
          console.log(`GATE_MILESTONE=${MS[ms]}`);
          console.log(`KEEP_PASS_FILES=${files.join(" ")}`);
          JS
      - run: node build/build.mjs --out release-out
        name: build (esbuild, no package.json in output)
      # T-F5 (DECISIONS-r9 F5, impl/03 section 4): grandchild kill, Windows only. Runs right after the build,
      # so a red later step never hides the T-F5 result.
      - run: node e2e/checks/windows-grandchild-kill.mjs
        name: T-F5 Windows grandchild kill (0 alive after KILL_GRACE_MS)
        if: runner.os == 'Windows'
      - run: node docs/v2/prompt/lint.mjs --out release-out
        name: prompt lint, bundle mode (impl/13 §7; gate layer prompt-lint from M2, D-M0-1)
      - run: node e2e/cases/run.mjs --milestone "$GATE_MILESTONE"
        name: GP cases tagged <= gate milestone (D-M0-2, D-M2-arch-4)
        shell: bash
      # v1 `pretest` ran tsc; KEEP-PASS files that import build/*.js (zod3tov4-production) need its
      # output. tsc only, not the v1 bundle step (D-M3-F-1, same as gate layer keep-pass).
      - run: npx tsc -p tsconfig.json
        name: v1 tsc output for KEEP-PASS files that import build/ (D-M3-F-1)
      # --testTimeout: go run / rustc / PowerShell cold starts exceed vitest's 5 s default on CI
      # runners; 60 s is the executor's own rustc compile cap (D-M2-R2-1).
      - run: npx vitest run --config tests/vitest.config.ts --testTimeout=60000 --hookTimeout=60000 $KEEP_PASS_FILES
        name: KEEP-PASS v1 tests, gate selection (DECISIONS-r9 G5, D-M2-arch-4)
        shell: bash
      - run: node build/build.mjs --generated-only
        name: src/prompt/_generated.ts for v2 unit tests (D-M2-arch-6)
      - run: node --test "tests/v2/**/*.test.mjs"
        name: v2 unit tests (TECH-SPEC 6.2a, DEVIATIONS D-M1-13, same as gate layer v2-unit)
      # The repo checks below do not depend on the test steps above. `!cancelled()` runs them after a
      # red test step too, so a test fail never hides their result on any OS (the job stays red).
      - run: node scripts/gen-keep-pass.mjs --check
        name: KEEP-PASS list is current
        if: ${{ !cancelled() }}
      - run: node scripts/ci-gs4-lint.mjs
        name: GS4 lint (no e2e import of src, ledger verdicts)
        if: ${{ !cancelled() }}
      - run: node build/check-readme.mjs
        name: README line cap (ADR-0015, README_MAX_LINES)
        if: ${{ !cancelled() }}
      # GS5 repo-cleanup gate (impl/15 §2, DEVIATIONS D-M7-arch-3/4). The check-removed layer starts
      # at M7 (D-M6-arch-2), the same rule as scripts/gate.mjs LAYER_START.
      - run: node build/check-removed.mjs
        name: GS5 check-removed (from gate milestone M7, D-M6-arch-2)
        if: ${{ !cancelled() && env.GATE_MILESTONE == 'M7' }}
