name: issue-intake
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check body and act
        env:
          BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/issue-intake.mjs > /tmp/result.json
          node .github/scripts/issue-intake-act.mjs /tmp/result.json
